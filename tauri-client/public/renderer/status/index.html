<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Aion Floating Pill</title>
    <link rel="icon" type="image/png" href="/assets/icons/flow-64.png"/>
    <script src="../hub/bridge.js"></script>
    <style>
      @property --glow-angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Container Centralizado */
      .capsule-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        position: relative;
      }

      /* PÍLULA FLUTUANTE REA (Wispr Flow Authentic Minimalist) */
      .thought-bubble {
        -webkit-app-region: drag;
        cursor: grab;
        position: relative;
        height: 30px;
        min-height: 30px;
        background: rgba(15, 15, 18, 0.88);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 2px 6px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 8px;
        transition: width 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 0.2s ease,
                    border-color 0.2s ease,
                    box-shadow 0.2s ease;
        will-change: width, transform;
      }

      .thought-bubble:active {
        cursor: grabbing;
      }

      /* GLOW HOVER RING (Wispr Flow signature conic glow) */
      .thought-bubble::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: conic-gradient(from var(--glow-angle), transparent 0%, rgba(255, 255, 235, 0.35) 12%, transparent 25%);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: destination-out;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }

      .thought-bubble:hover::after {
        opacity: 1;
        animation: rotateGlow 3s linear infinite;
      }

      @keyframes rotateGlow {
        to { --glow-angle: 360deg; }
      }

      /* ==================== ESTADO 1: RESTING (Pronto / Compacto) ==================== */
      .thought-bubble.state-resting {
        width: 142px;
      }

      .resting-content {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        height: 100%;
      }

      .aion-glyph-btn {
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: no-drag;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .aion-glyph-btn:hover {
        transform: scale(1.1);
        opacity: 0.9;
      }

      .flow-symbol-svg {
        width: 15px;
        height: 15px;
        filter: drop-shadow(0 0 4px rgba(255, 255, 235, 0.35));
      }

      .nudge-shortcut {
        display: flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }

      .nudge-key {
        font-size: 9.5px;
        line-height: 1;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 2px 4px;
        background: #FAF8F2;
        color: #121216;
        border-radius: 3px;
        box-shadow: -1px 1px 0 rgba(70, 70, 70, 0.8);
        white-space: nowrap;
        letter-spacing: -0.2px;
      }

      .nudge-label {
        font-size: 11px;
        font-weight: 550;
        color: #EDEDED;
        letter-spacing: -0.1px;
        white-space: nowrap;
        opacity: 0.85;
      }

      .hover-actions {
        display: flex;
        align-items: center;
        gap: 3px;
        margin-left: auto;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
        -webkit-app-region: no-drag;
      }

      .thought-bubble:hover .hover-actions {
        opacity: 1;
        pointer-events: auto;
      }

      .mini-btn {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: #C0C0C4;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.12s ease, color 0.12s ease;
      }
      .mini-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        color: #FFFFFF;
      }

      /* ==================== ESTADO 2: RECORDING (PTT Ativo) ==================== */
      .thought-bubble.state-recording {
        width: 76px;
        background: rgba(18, 14, 16, 0.92);
        border-color: rgba(255, 69, 58, 0.4);
        box-shadow: 0 0 16px rgba(255, 69, 58, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      .waveform-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        height: 18px;
        width: 100%;
        --audio-scale: 1;
      }

      .wave-bar {
        width: 2.2px;
        height: 12px;
        background: #FFFFFF;
        border-radius: 1px;
        transform-origin: center;
        will-change: transform;
        transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1)));
        animation: waveAnim 1s infinite ease-in-out;
      }

      @keyframes waveAnim {
        0%, 100% { transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1) * 0.8)); }
        20% { transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1) * 1.25)); }
        40% { transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1) * 1.6)); }
        80% { transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1) * 1.1)); }
        90% { transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1) * 1.35)); }
      }

      /* ==================== ESTADO 3: PROCESSING (Rainbow Conic Ring) ==================== */
      .thought-bubble.state-processing {
        width: 98px;
        background: #0f0f12;
        border: none !important;
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }

      .thought-bubble.state-processing::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 300px;
        height: 300px;
        background: conic-gradient(from 0deg, #f0d7ff, #ffbcf2, #ff6c4c, #ffa946, #7232a6, #f0d7ff);
        transform: translate(-50%, -50%) rotate(0deg);
        transform-origin: center center;
        animation: rainbowSpin 3.5s linear infinite;
        will-change: transform;
        z-index: 0;
      }

      .thought-bubble.state-processing::after {
        content: "";
        position: absolute;
        inset: 1px;
        background: #0f0f12;
        border-radius: inherit;
        z-index: 1;
        opacity: 1 !important;
        animation: none !important;
        mask: none !important;
        -webkit-mask: none !important;
      }

      @keyframes rainbowSpin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      .processing-content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      /* Radial 8-bar spinner (authentic Wispr REA module-64037) */
      .radial-spinner {
        position: relative;
        width: 14px;
        height: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .spinner-tick {
        position: absolute;
        width: 1.8px;
        height: 4.5px;
        border-radius: 1px;
        background: rgba(163, 148, 199, 0.3);
        transform-origin: center center;
        animation: tickFade 1.1s linear infinite;
      }

      @keyframes tickFade {
        0% { background: rgba(163, 148, 199, 0.95); }
        100% { background: rgba(163, 148, 199, 0.15); }
      }

      .processing-label {
        font-size: 11px;
        font-weight: 550;
        color: #C4B5FD;
        letter-spacing: -0.1px;
        white-space: nowrap;
      }

      /* ==================== ESTADO 4: COMPLETED (Checkmark Sucesso) ==================== */
      .thought-bubble.state-completed {
        width: 104px;
        border-color: rgba(52, 199, 89, 0.45);
        box-shadow: 0 0 16px rgba(52, 199, 89, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      .completed-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        color: #34C759;
      }

      .check-icon {
        width: 13px;
        height: 13px;
        stroke: #34C759;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .completed-label {
        font-size: 11px;
        font-weight: 600;
        color: #34C759;
        letter-spacing: -0.1px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="capsule-wrapper">
      <div class="thought-bubble state-resting" id="thoughtBubble" title="Aion Voice Dictation (Ctrl+Win)">
        <!-- Conteúdo Injetado Dinamicamente -->
        <div id="bubbleInner" style="display:flex;align-items:center;width:100%;height:100%;justify-content:center;"></div>
      </div>
    </div>

    <script>
      const thoughtBubble = document.getElementById("thoughtBubble");
      const bubbleInner = document.getElementById("bubbleInner");

      let currentStatus = "resting";
      let audioScale = 1;

      // Renderiza o interior da cápsula com base no estado REA
      function renderBubble(status) {
        currentStatus = status;
        thoughtBubble.className = "thought-bubble";

        if (status === "active_ptt" || status === "active" || status === "listening") {
          // ==================== GRAVANDO (Waveform 5 barras parabólicas) ====================
          thoughtBubble.classList.add("state-recording");
          bubbleInner.innerHTML = `
            <div class="waveform-wrap" id="waveWrap">
              <div class="wave-bar" style="--bar-scale: 0.35; animation-delay: -0.2s;"></div>
              <div class="wave-bar" style="--bar-scale: 0.70; animation-delay: -0.1s;"></div>
              <div class="wave-bar" style="--bar-scale: 1.00; animation-delay: 0s;"></div>
              <div class="wave-bar" style="--bar-scale: 0.70; animation-delay: 0.1s;"></div>
              <div class="wave-bar" style="--bar-scale: 0.35; animation-delay: 0.2s;"></div>
            </div>
          `;
        } else if (status === "polish_processing" || status === "processing") {
          // ==================== PROCESSANDO (Rainbow Conic + Radial 8-bar Spinner) ====================
          thoughtBubble.classList.add("state-processing");
          let ticks = "";
          for (let i = 0; i < 8; i++) {
            const rot = i * 45;
            const delay = (0.1375 * -(7 - i)).toFixed(4);
            ticks += `<div class="spinner-tick" style="transform: rotate(${rot}deg) translate(0, -5px); animation-delay: ${delay}s;"></div>`;
          }
          bubbleInner.innerHTML = `
            <div class="processing-content">
              <div class="radial-spinner">${ticks}</div>
              <span class="processing-label">Aion...</span>
            </div>
          `;
        } else if (status === "polish_completed_action" || status === "completed") {
          // ==================== CONCLUÍDO (Checkmark verde) ====================
          thoughtBubble.classList.add("state-completed");
          bubbleInner.innerHTML = `
            <div class="completed-content">
              <svg class="check-icon" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span class="completed-label">Copiado!</span>
            </div>
          `;
          setTimeout(() => {
            if (currentStatus === "polish_completed_action" || currentStatus === "completed") {
              renderBubble("resting");
            }
          }, 1400);
        } else {
          // ==================== RESTING (Aion Glyph + Teclas de Atalho) ====================
          thoughtBubble.classList.add("state-resting");
          bubbleInner.innerHTML = `
            <div class="resting-content">
              <div class="aion-glyph-btn" id="glyphBtn" title="Abrir Aion Hub">
                <svg class="flow-symbol-svg" viewBox="0 0 187 187" fill="none">
                  <rect width="187" height="187" rx="40" fill="#1A1A1A"/>
                  <path d="M48.1 41.6C44.2 41.6 40.6 45.2 40.6 49.1V137.8C40.6 142.5 44.3 145.4 48.1 145.4C52 145.4 55.6 141.8 55.6 137.9V49.1C55.6 45.2 52 41.6 48.1 41.6Z" fill="#FFFFEB"/>
                  <path d="M93.4 58.6C89.6 58.6 85.9 62.2 85.9 66V120.2C85.9 124.1 89.6 127.6 93.4 127.6C97.3 127.6 101 124.1 101 120.2V66C101 62.2 97.3 58.6 93.4 58.6Z" fill="#FFFFEB"/>
                  <path d="M70.8 89.1C66.8 89.1 63.2 92.7 63.2 96.6V127.5C63.2 131.3 66.8 134.9 70.8 134.9C74.7 134.9 78.3 131.3 78.3 127.5V96.6C78.3 92.7 74.7 89.1 70.8 89.1Z" fill="#FFFFEB"/>
                  <path d="M138.7 41.6C134.9 41.6 131.1 45.2 131.1 49.1V137.8C131.1 141.7 134.8 145.3 138.7 145.3C142.6 145.3 146.2 141.7 146.2 137.8V49.1C146.2 45.2 142.6 41.6 138.7 41.6Z" fill="#FFFFEB"/>
                  <path d="M116 89.1C112 89.1 108.5 92.7 108.5 96.6V127.5C108.5 131.3 112 134.9 116 134.9C120 134.9 123.6 131.3 123.6 127.5V96.6C123.6 92.7 120 89.1 116 89.1Z" fill="#FFFFEB"/>
                </svg>
              </div>
              <div class="nudge-shortcut" title="Atalho global para falar">
                <span class="nudge-key">Ctrl</span>
                <span class="nudge-key">Win</span>
              </div>
              <span class="nudge-label">Aion</span>
              <div class="hover-actions">
                <button class="mini-btn" id="openHubBtn" title="Abrir Aion Hub">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                    <line x1="9" x2="9" y1="3" y2="21"/>
                  </svg>
                </button>
                <button class="mini-btn" id="hideBtn" title="Ocultar Barra Flutuante">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"/>
                    <path d="m6 6 12 12"/>
                  </svg>
                </button>
              </div>
            </div>
          `;

          // Eventos dos botões no modo resting
          const glyph = document.getElementById("glyphBtn");
          const openHubBtn = document.getElementById("openHubBtn");
          const hideBtn = document.getElementById("hideBtn");

          const toggleHub = (e) => {
            e.stopPropagation();
            if (window.flowNative && window.flowNative.toggleHub) {
              window.flowNative.toggleHub();
            }
          };

          if (glyph) glyph.addEventListener("click", toggleHub);
          if (openHubBtn) openHubBtn.addEventListener("click", toggleHub);

          if (hideBtn) {
            hideBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              if (window.flowNative && window.flowNative.toggleStatus) {
                window.flowNative.toggleStatus();
              }
            });
          }
        }
      }

      // Escuta mudanças de status disparadas pelo Bridge
      window.addEventListener("flow:dictationStatus", (e) => {
        renderBubble(e.detail);
      });

      // Escuta nível de áudio em tempo real para animar as barras
      window.addEventListener("flow:audioLevel", (e) => {
        const level = e.detail || 0;
        const wrap = document.getElementById("waveWrap");
        if (wrap) {
          // Escala suave de 0.8 a 2.5x dependendo da amplitude da voz
          const s = Math.min(2.5, Math.max(0.7, 0.8 + level * 2.8));
          wrap.style.setProperty("--audio-scale", s);
        }
      });

      // Suporte a clique direto na cápsula para iniciar/parar
      thoughtBubble.addEventListener("click", (e) => {
        // Se não clicou num botão interno
        if (e.target.closest(".mini-btn") || e.target.closest(".aion-glyph-btn")) return;
        if (typeof window.__flowToggleDictation === "function") {
          window.__flowToggleDictation();
        }
      });

      // Inicializa
      renderBubble("resting");
    </script>
  </body>
</html>
