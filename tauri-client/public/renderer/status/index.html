<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Flow Floating Pill Dock</title>
    <link rel="icon" type="image/png" href="/assets/icons/flow-64.png"/>
    <script src="../hub/bridge.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Container Principal */
      .widget-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* MODO PÍLULA (Compacto) */
      .floating-pill {
        -webkit-app-region: drag;
        cursor: grab;
        width: 312px;
        height: 44px;
        background: rgba(18, 18, 22, 0.94);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 9999px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px 0 12px;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .floating-pill:active {
        cursor: grabbing;
      }

      .pill-left {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: no-drag;
        cursor: pointer;
      }

      .flow-symbol-svg {
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 0 5px rgba(255, 255, 235, 0.35));
      }

      .pill-center {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        margin-left: 6px;
        flex: 1;
        overflow: hidden;
        pointer-events: none;
      }

      .pill-title {
        font-size: 12px;
        font-weight: 600;
        color: #EDEDED;
        letter-spacing: -0.2px;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .pill-sub {
        font-size: 9.5px;
        font-weight: 500;
        color: #8E8D91;
        letter-spacing: -0.1px;
        white-space: nowrap;
      }

      /* Audio waveforms */
      .wave-container {
        display: none;
        align-items: center;
        gap: 2.5px;
        height: 14px;
      }

      .wave-bar {
        width: 2.5px;
        background: #FF453A;
        border-radius: 999px;
        height: 4px;
        transition: height 0.08s ease;
      }

      .rec-dot {
        display: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #FF453A;
        box-shadow: 0 0 8px #FF453A;
        animation: recPulse 1.2s infinite;
      }

      @keyframes recPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      /* Ações da Pílula */
      .pill-actions {
        display: flex;
        align-items: center;
        gap: 3px;
        -webkit-app-region: no-drag;
      }

      .action-btn {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #EDEDED;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .action-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        color: #FFFFFF;
        transform: scale(1.05);
      }

      .action-btn:active {
        transform: scale(0.95);
      }

      .action-btn.mic-btn {
        background: rgba(255, 255, 255, 0.12);
      }

      .action-btn.mic-btn.active {
        background: #FF453A;
        color: #FFFFFF;
        box-shadow: 0 0 12px rgba(255, 69, 58, 0.6);
      }

      /* MODO EXPANDIDO: CAMPO DE TEXTO AO VIVO */
      .expanded-card {
        display: none;
        width: 432px;
        height: 232px;
        background: rgba(18, 18, 24, 0.96);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 16px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        flex-direction: column;
        overflow: hidden;
        animation: cardIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes cardIn {
        from { opacity: 0; transform: translateY(12px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .card-header {
        -webkit-app-region: drag;
        cursor: grab;
        height: 40px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.02);
      }

      .card-header:active {
        cursor: grabbing;
      }

      .header-title-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        color: #EDEDED;
      }

      .badge-state {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #A0A0A5;
      }
      .badge-state.recording {
        background: rgba(255, 69, 58, 0.2);
        color: #FF453A;
        border: 1px solid rgba(255, 69, 58, 0.4);
      }
      .badge-state.processing {
        background: rgba(167, 139, 250, 0.2);
        color: #C4B5FD;
        border: 1px solid rgba(167, 139, 250, 0.4);
      }
      .badge-state.copied {
        background: rgba(52, 199, 89, 0.2);
        color: #34C759;
        border: 1px solid rgba(52, 199, 89, 0.4);
      }

      /* ÁREA DO CAMPO DE TEXTO */
      .card-body {
        flex: 1;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        position: relative;
        -webkit-app-region: no-drag;
      }

      .live-textarea {
        width: 100%;
        height: 100%;
        background: rgba(10, 10, 14, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 10px 12px;
        color: #F5F5F5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13.5px;
        line-height: 1.55;
        resize: none;
        outline: none;
        transition: border 0.15s ease;
      }

      .live-textarea:focus {
        border-color: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
      }

      .live-textarea::placeholder {
        color: #636266;
        font-style: italic;
      }

      /* RODAPÉ DO CARD */
      .card-footer {
        height: 38px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.02);
        -webkit-app-region: no-drag;
      }

      .footer-stats {
        font-size: 10.5px;
        color: #8E8D91;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .footer-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btn-pill {
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.08);
        color: #EDEDED;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: all 0.15s ease;
      }

      .btn-pill:hover {
        background: rgba(255, 255, 255, 0.16);
        color: #FFFFFF;
      }

      .btn-pill.primary {
        background: #F5F5F5;
        color: #121212;
        border: none;
        font-weight: 600;
      }
      .btn-pill.primary:hover {
        background: #FFFFFF;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
      }

      /* Estados do Card */
      .is-expanded .floating-pill { display: none !important; }
      .is-expanded .expanded-card { display: flex !important; }
    </style>
  </head>
  <body>
    <div class="widget-container" id="widgetContainer">
      <!-- MODO 1: PÍLULA FLUTUANTE COMPACTA -->
      <div class="floating-pill" id="flowPill">
        <!-- Logo Esquerda: Clicar abre o Hub -->
        <div class="pill-left" id="hubLogoBtn" title="Abrir Flow Hub">
          <svg class="flow-symbol-svg" viewBox="0 0 187 187" fill="none">
            <rect width="187" height="187" rx="40" fill="#1A1A1A"/>
            <path d="M48.1 41.6C44.2 41.6 40.6 45.2 40.6 49.1V137.8C40.6 142.5 44.3 145.4 48.1 145.4C52 145.4 55.6 141.8 55.6 137.9V49.1C55.6 45.2 52 41.6 48.1 41.6Z" fill="#FFFFEB"/>
            <path d="M93.4 58.6C89.6 58.6 85.9 62.2 85.9 66V120.2C85.9 124.1 89.6 127.6 93.4 127.6C97.3 127.6 101 124.1 101 120.2V66C101 62.2 97.3 58.6 93.4 58.6Z" fill="#FFFFEB"/>
            <path d="M70.8 89.1C66.8 89.1 63.2 92.7 63.2 96.6V127.5C63.2 131.3 66.8 134.9 70.8 134.9C74.7 134.9 78.3 131.3 78.3 127.5V96.6C78.3 92.7 74.7 89.1 70.8 89.1Z" fill="#FFFFEB"/>
            <path d="M138.7 41.6C134.9 41.6 131.1 45.2 131.1 49.1V137.8C131.1 141.7 134.8 145.3 138.7 145.3C142.6 145.3 146.2 141.7 146.2 137.8V49.1C146.2 45.2 142.6 41.6 138.7 41.6Z" fill="#FFFFEB"/>
            <path d="M116 89.1C112 89.1 108.5 92.7 108.5 96.6V127.5C108.5 131.3 112 134.9 116 134.9C120 134.9 123.6 131.3 123.6 127.5V96.6C123.6 92.7 120 89.1 116 89.1Z" fill="#FFFFEB"/>
          </svg>
        </div>

        <!-- Centro: Status & Feedback em tempo real -->
        <div class="pill-center" id="pillCenter">
          <div class="pill-title" id="pillTitle">
            <span class="rec-dot" id="recDot"></span>
            <span id="titleText">Flow</span>
            <div class="wave-container" id="waveContainer">
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
            </div>
          </div>
          <div class="pill-sub" id="subText">Ctrl+Alt+Espaço</div>
        </div>

        <!-- Ações da Pílula -->
        <div class="pill-actions">
          <!-- Botão Expandir para Campo de Texto -->
          <button class="action-btn" id="expandBtn" title="Abrir Campo de Texto ao Vivo">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          </button>

          <!-- Microfone: Iniciar / Pausar Gravação -->
          <button class="action-btn mic-btn" id="micBtn" title="Gravar / Pausar Voz (Ctrl+Alt+Espaço)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
          </button>

          <!-- Abrir Hub Oficial -->
          <button class="action-btn" id="hubBtn" title="Abrir Flow Hub">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
              <line x1="9" x2="9" y1="3" y2="21"/>
            </svg>
          </button>

          <!-- Fechar / Ocultar Barra -->
          <button class="action-btn" id="closeBtn" title="Ocultar Barra Flutuante">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"/>
              <path d="m6 6 12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- MODO 2: CAMPO DE DITADO AO VIVO EXPANDIDO -->
      <div class="expanded-card" id="expandedCard">
        <!-- Topo: Título, Status e Ações -->
        <div class="card-header">
          <div class="header-title-wrap">
            <svg class="flow-symbol-svg" style="width: 17px; height: 17px;" viewBox="0 0 187 187" fill="none">
              <rect width="187" height="187" rx="40" fill="#1A1A1A"/>
              <path d="M48.1 41.6C44.2 41.6 40.6 45.2 40.6 49.1V137.8C40.6 142.5 44.3 145.4 48.1 145.4C52 145.4 55.6 141.8 55.6 137.9V49.1C55.6 45.2 52 41.6 48.1 41.6Z" fill="#FFFFEB"/>
              <path d="M93.4 58.6C89.6 58.6 85.9 62.2 85.9 66V120.2C85.9 124.1 89.6 127.6 93.4 127.6C97.3 127.6 101 124.1 101 120.2V66C101 62.2 97.3 58.6 93.4 58.6Z" fill="#FFFFEB"/>
              <path d="M70.8 89.1C66.8 89.1 63.2 92.7 63.2 96.6V127.5C63.2 131.3 66.8 134.9 70.8 134.9C74.7 134.9 78.3 131.3 78.3 127.5V96.6C78.3 92.7 74.7 89.1 70.8 89.1Z" fill="#FFFFEB"/>
              <path d="M138.7 41.6C134.9 41.6 131.1 45.2 131.1 49.1V137.8C131.1 141.7 134.8 145.3 138.7 145.3C142.6 145.3 146.2 141.7 146.2 137.8V49.1C146.2 45.2 142.6 41.6 138.7 41.6Z" fill="#FFFFEB"/>
              <path d="M116 89.1C112 89.1 108.5 92.7 108.5 96.6V127.5C108.5 131.3 112 134.9 116 134.9C120 134.9 123.6 131.3 123.6 127.5V96.6C123.6 92.7 120 89.1 116 89.1Z" fill="#FFFFEB"/>
            </svg>
            <span>Flow Ditado</span>
            <span class="badge-state" id="cardBadge">Pronto</span>
          </div>

          <div style="display: flex; align-items: center; gap: 4px; -webkit-app-region: no-drag;">
            <!-- Microfone no topo do card -->
            <button class="action-btn mic-btn" id="cardMicBtn" title="Gravar / Pausar Voz">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" x2="12" y1="19" y2="22"/>
              </svg>
            </button>

            <!-- Recolher para Pílula -->
            <button class="action-btn" id="collapseBtn" title="Recolher para Pílula Compacta">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <polyline points="4 14 10 14 10 20"></polyline>
                <polyline points="20 10 14 10 14 4"></polyline>
                <line x1="14" y1="10" x2="21" y2="3"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
              </svg>
            </button>

            <!-- Fechar Barra -->
            <button class="action-btn" id="cardCloseBtn" title="Ocultar Barra">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18"/>
                <path d="m6 6 12 12"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Corpo: O Campo de Texto em Tempo Real -->
        <div class="card-body">
          <textarea
            class="live-textarea"
            id="liveTextArea"
            placeholder="Fale agora... suas palavras aparecerão aqui em tempo real conforme você fala |"
            spellcheck="false"
          ></textarea>
        </div>

        <!-- Rodapé: Estatísticas e Botões -->
        <div class="card-footer">
          <div class="footer-stats" id="footerStats">
            <span id="wordCount">0 palavras</span>
            <span>•</span>
            <span id="charCount">0 caracteres</span>
          </div>

          <div class="footer-actions">
            <!-- Limpar -->
            <button class="btn-pill" id="clearBtn" title="Limpar Texto">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              </svg>
              Limpar
            </button>

            <!-- Copiar -->
            <button class="btn-pill primary" id="copyBtn" title="Copiar para Área de Transferência">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
              <span id="copyBtnText">Copiar</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const widgetContainer = document.getElementById("widgetContainer");
      const flowPill = document.getElementById("flowPill");
      const expandedCard = document.getElementById("expandedCard");

      const titleText = document.getElementById("titleText");
      const subText = document.getElementById("subText");
      const recDot = document.getElementById("recDot");
      const waveContainer = document.getElementById("waveContainer");
      const waveBars = document.querySelectorAll(".wave-bar");

      const micBtn = document.getElementById("micBtn");
      const cardMicBtn = document.getElementById("cardMicBtn");
      const hubBtn = document.getElementById("hubBtn");
      const hubLogoBtn = document.getElementById("hubLogoBtn");
      const closeBtn = document.getElementById("closeBtn");
      const cardCloseBtn = document.getElementById("cardCloseBtn");

      const expandBtn = document.getElementById("expandBtn");
      const collapseBtn = document.getElementById("collapseBtn");
      const liveTextArea = document.getElementById("liveTextArea");
      const cardBadge = document.getElementById("cardBadge");
      const wordCount = document.getElementById("wordCount");
      const charCount = document.getElementById("charCount");
      const clearBtn = document.getElementById("clearBtn");
      const copyBtn = document.getElementById("copyBtn");
      const copyBtnText = document.getElementById("copyBtnText");

      let isExpanded = false;
      let currentStatus = "resting";
      let recordingStartTime = 0;
      let timerInterval = null;

      function setExpandedMode(expand, shouldFocus = false) {
        isExpanded = expand;
        if (isExpanded) {
          widgetContainer.classList.add("is-expanded");
          if (window.flowNative && window.flowNative.setStatusSize) {
            window.flowNative.setStatusSize(440, 240, true);
          }
          if (shouldFocus) {
            liveTextArea.focus();
          }
        } else {
          widgetContainer.classList.remove("is-expanded");
          if (window.flowNative && window.flowNative.setStatusSize) {
            window.flowNative.setStatusSize(320, 52, true);
          }
        }
      }

      function updateStats() {
        const text = liveTextArea.value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        const chars = liveTextArea.value.length;
        wordCount.textContent = `${words} palavra${words === 1 ? '' : 's'}`;
        charCount.textContent = `${chars} caractere${chars === 1 ? '' : 's'}`;
      }

      function updateStatus(status) {
        currentStatus = status;

        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        if (status === "active_ptt" || status === "active") {
          // Gravação ativa
          recDot.style.display = "inline-block";
          waveContainer.style.display = "flex";
          subText.style.display = "none";
          titleText.style.color = "#FF453A";
          titleText.textContent = "Ouvindo...";

          micBtn.classList.add("active");
          cardMicBtn.classList.add("active");

          cardBadge.className = "badge-state recording";
          cardBadge.textContent = "Gravando...";

          recordingStartTime = Date.now();
          timerInterval = setInterval(() => {
            const sec = Math.floor((Date.now() - recordingStartTime) / 1000);
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            cardBadge.textContent = `Gravando ${m}:${s < 10 ? '0' : ''}${s}`;
          }, 500);

        } else if (status === "polish_processing" || status === "processing") {
          // Processando AI
          recDot.style.display = "none";
          waveContainer.style.display = "none";
          subText.style.display = "block";
          titleText.style.color = "#A78BFA";
          titleText.textContent = "Transcrevendo...";
          subText.textContent = "Groq Whisper...";

          micBtn.classList.remove("active");
          cardMicBtn.classList.remove("active");

          cardBadge.className = "badge-state processing";
          cardBadge.textContent = "✨ Transcrevendo...";

        } else if (status === "polish_completed_action" || status === "completed") {
          // Concluído
          recDot.style.display = "none";
          waveContainer.style.display = "none";
          subText.style.display = "block";
          titleText.style.color = "#34C759";
          titleText.textContent = "✓ Copiado!";
          subText.textContent = "Área de transferência";

          micBtn.classList.remove("active");
          cardMicBtn.classList.remove("active");

          cardBadge.className = "badge-state copied";
          cardBadge.textContent = "✓ Copiado!";

          setTimeout(() => {
            if (currentStatus === "polish_completed_action") {
              updateStatus("resting");
            }
          }, 2000);

        } else {
          // Resting / Idle
          recDot.style.display = "none";
          waveContainer.style.display = "none";
          subText.style.display = "block";
          titleText.style.color = "#EDEDED";
          titleText.textContent = "Flow";
          subText.textContent = "Ctrl+Alt+Espaço";

          micBtn.classList.remove("active");
          cardMicBtn.classList.remove("active");

          cardBadge.className = "badge-state";
          cardBadge.textContent = "Pronto";
        }
      }

      // Recebe texto falado em tempo real
      window.addEventListener("flow:liveTranscript", (e) => {
        const { text, isFinal } = e.detail || {};
        if (typeof text === "string" && text.length > 0) {
          liveTextArea.value = text;
          updateStats();
          // Garante rolagem até o fim
          liveTextArea.scrollTop = liveTextArea.scrollHeight;
        }
      });

      // Animação reativa do volume de áudio do microfone
      window.addEventListener("flow:audioLevel", (e) => {
        const level = e.detail || 0;
        waveBars.forEach((bar, index) => {
          const mult = [0.8, 1.4, 2.0, 1.6, 0.9][index] || 1;
          const h = Math.min(16, Math.max(3, Math.round(level * 22 * mult)));
          bar.style.height = `${h}px`;
        });
      });

      // Recebe mudança de status
      window.addEventListener("flow:dictationStatus", (e) => {
        updateStatus(e.detail);
      });

      // Suporte a Push-to-Talk (Pressionar e segurar para falar, soltar para colar!)
      let isHoldingMic = false;
      let micPressStartTime = 0;

      const handleMicDown = (e) => {
        e.preventDefault();
        isHoldingMic = true;
        micPressStartTime = Date.now();
        if (typeof window.__flowStartDictation === "function") {
          window.__flowStartDictation();
        } else if (typeof window.__flowToggleDictation === "function") {
          window.__flowToggleDictation(true);
        }
      };

      const handleMicUp = (e) => {
        if (!isHoldingMic) return;
        isHoldingMic = false;
        const pressDuration = Date.now() - micPressStartTime;
        // Se segurou por mais de 250ms, ao soltar ele finaliza a gravação imediatamente (Wispr Flow PTT)
        // Se deu só um clique rápido (< 250ms), ele alterna o modo contínuo (Hands-free)
        if (pressDuration >= 250) {
          if (typeof window.__flowStopDictation === "function") {
            window.__flowStopDictation();
          } else if (typeof window.__flowToggleDictation === "function") {
            window.__flowToggleDictation(false);
          }
        }
      };

      micBtn.addEventListener("mousedown", handleMicDown);
      cardMicBtn.addEventListener("mousedown", handleMicDown);
      window.addEventListener("mouseup", handleMicUp);

      // Clique simples como fallback
      const toggleRecord = () => {
        const pressDuration = Date.now() - micPressStartTime;
        if (pressDuration < 250 && typeof window.__flowToggleDictation === "function") {
          window.__flowToggleDictation();
        }
      };
      micBtn.addEventListener("click", toggleRecord);
      cardMicBtn.addEventListener("click", toggleRecord);

      // Expandir / Recolher
      expandBtn.addEventListener("click", () => setExpandedMode(true, true));
      collapseBtn.addEventListener("click", () => setExpandedMode(false));

      // Limpar Campo
      clearBtn.addEventListener("click", () => {
        liveTextArea.value = "";
        updateStats();
        liveTextArea.focus();
      });

      // Copiar Campo
      copyBtn.addEventListener("click", () => {
        const text = liveTextArea.value;
        if (!text) return;
        if (window.flowNative && window.flowNative.copyToClipboard) {
          window.flowNative.copyToClipboard(text);
        } else {
          navigator.clipboard.writeText(text).catch(() => {});
        }
        copyBtnText.textContent = "✓ Copiado!";
        copyBtn.style.background = "#34C759";
        copyBtn.style.color = "#FFFFFF";
        setTimeout(() => {
          copyBtnText.textContent = "Copiar";
          copyBtn.style.background = "#F5F5F5";
          copyBtn.style.color = "#121212";
        }, 1500);
      });

      // Digitação manual atualiza estatísticas
      liveTextArea.addEventListener("input", updateStats);

      // Abrir Hub
      const openHub = () => {
        if (window.flowNative && window.flowNative.toggleHub) {
          window.flowNative.toggleHub();
        }
      };
      hubBtn.addEventListener("click", openHub);
      hubLogoBtn.addEventListener("click", openHub);

      // Fechar barra
      const closeBar = () => {
        if (window.flowNative && window.flowNative.toggleStatus) {
          window.flowNative.toggleStatus();
        }
      };
      closeBtn.addEventListener("click", closeBar);
      cardCloseBtn.addEventListener("click", closeBar);

      // Inicializa
      updateStatus("resting");
      updateStats();
    </script>
  </body>
</html>
