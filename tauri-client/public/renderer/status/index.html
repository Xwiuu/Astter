<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Astter Capsule</title>
    <link rel="icon" type="image/png" href="/assets/icons/flow-64.png"/>
    <script src="../hub/bridge.js"></script>
    <style>
      @property --glow-angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none !important;
      }

      /* Container Centralizado */
      .capsule-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        position: relative;
        pointer-events: none !important;
      }

      /* PÍLULA FLUTUANTE REA (Astter Authentic Minimalist) */
      .thought-bubble {
        -webkit-app-region: no-drag !important;
        cursor: default !important;
        user-select: none;
        position: relative;
        height: 30px;
        min-height: 30px;
        background: rgba(15, 15, 18, 0.88);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 2px 6px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
        transition: width 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 0.2s ease,
                    border-color 0.2s ease,
                    box-shadow 0.2s ease;
        will-change: width, transform;
        pointer-events: auto !important;
      }

      .drag-handle {
        -webkit-app-region: drag !important;
        cursor: grab !important;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.45);
        padding: 0 4px 0 2px;
        height: 100%;
        user-select: none;
        flex-shrink: 0;
        transition: color 0.15s ease;
        pointer-events: auto !important;
      }

      .drag-handle:hover {
        color: rgba(255, 255, 255, 0.95);
      }

      .drag-handle:active {
        cursor: grabbing !important;
        color: #FFFFFF;
      }

      .drag-handle svg {
        display: block;
        pointer-events: none;
      }

      /* GLOW HOVER RING (Astter signature conic glow) */
      .thought-bubble::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: conic-gradient(from var(--glow-angle), transparent 0%, rgba(255, 255, 235, 0.35) 12%, transparent 25%);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: destination-out;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }

      .thought-bubble:hover::after {
        opacity: 1;
        animation: rotateGlow 3s linear infinite;
      }

      @keyframes rotateGlow {
        to { --glow-angle: 360deg; }
      }

      /* Pulso disparado quando a cápsula troca de posição (topo/baixo/lados): a
         janela pula pra um canto bem diferente da tela sem nenhuma transição de
         movimento (o KWin só "teleporta" a janela), então sem isso o usuário não
         percebe que algo mudou se não estiver olhando pro canto novo. */
      @keyframes capsuleRepositionPulse {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
        35% { transform: scale(1.3); box-shadow: 0 0 22px 6px rgba(56, 189, 248, 0.55); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
      }

      .thought-bubble.reposition-pulse {
        animation: capsuleRepositionPulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* ==================== ESTADO 1: RESTING (Grip + Logo) ==================== */
      .thought-bubble.state-resting {
        width: 46px;
        min-width: 46px;
        height: 32px;
        min-height: 32px;
        border-radius: 10px;
        padding: 0 4px;
        cursor: pointer !important;
      }

      .resting-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 100%;
        -webkit-app-region: no-drag !important;
        cursor: pointer !important;
        pointer-events: auto !important;
      }

      .flow-symbol-svg {
        width: 16px;
        height: 16px;
        filter: drop-shadow(0 0 5px rgba(255, 255, 235, 0.45));
        transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
      }

      .thought-bubble.state-resting:hover .flow-symbol-svg {
        transform: scale(1.15);
      }

      /* ==================== ESTADO 1B: MENU (Grip + Mic + Meeting + Logo + Settings) ==================== */
      .thought-bubble.state-menu {
        width: 194px;
        min-width: 194px;
        padding: 0 8px 0 6px;
        background: rgba(18, 18, 22, 0.96);
        border-color: rgba(255, 255, 255, 0.16);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        cursor: default !important;
      }

      /* ==================== ESTADO 5: REUNIÃO ATIVA (Granola / Dual Channel) ==================== */
      .thought-bubble.state-meeting {
        width: 200px;
        min-width: 200px;
        padding: 0 8px;
        background: rgba(18, 18, 22, 0.96);
        border-color: rgba(239, 68, 68, 0.45);
        box-shadow: 0 0 16px rgba(239, 68, 68, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      .meeting-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 6px;
      }

      .meeting-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ef4444;
        animation: recPulse 1.2s infinite;
        flex-shrink: 0;
      }

      @keyframes recPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(1.2); }
      }

      .meeting-time {
        font-family: monospace;
        font-size: 11px;
        font-weight: 600;
        color: #fca5a5;
      }

      .meeting-speaker-pill {
        font-size: 10px;
        color: #f97316;
        background: rgba(249, 115, 22, 0.15);
        padding: 1px 6px;
        border-radius: 4px;
        max-width: 68px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stop-meeting-btn {
        background: rgba(239, 68, 68, 0.2);
        border: 1px solid rgba(239, 68, 68, 0.5);
        color: #ef4444;
        border-radius: 4px;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 9px;
        padding: 0;
        transition: all 0.15s ease;
      }
      .stop-meeting-btn:hover {
        background: #ef4444;
        color: #ffffff;
      }

      .menu-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        gap: 6px;
        -webkit-app-region: no-drag !important;
        pointer-events: auto !important;
        animation: menuFadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes menuFadeIn {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }

      .pill-btn {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #E0E0E5;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer !important;
        -webkit-app-region: no-drag !important;
        pointer-events: auto !important;
        transition: all 0.14s cubic-bezier(0.16, 1, 0.3, 1);
        flex-shrink: 0;
      }

      .pill-btn svg {
        pointer-events: none;
      }

      .pill-btn:hover {
        transform: scale(1.14);
        background: rgba(255, 255, 255, 0.22);
        color: #FFFFFF;
      }

      .pill-btn:active {
        transform: scale(0.92);
      }

      .pill-btn.mic-btn:hover {
        background: rgba(255, 69, 58, 0.32);
        color: #FF453A;
        box-shadow: 0 0 10px rgba(255, 69, 58, 0.45);
      }

      .pill-btn.settings-btn:hover {
        background: rgba(167, 139, 250, 0.3);
        color: #C4B5FD;
        box-shadow: 0 0 10px rgba(167, 139, 250, 0.4);
      }

      .pill-btn.position-btn:hover {
        background: rgba(56, 189, 248, 0.3);
        color: #7DD3FC;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      }

      .menu-center-logo {
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer !important;
        -webkit-app-region: no-drag !important;
        pointer-events: auto !important;
        transition: transform 0.14s ease, opacity 0.14s ease;
        flex-shrink: 0;
      }

      .menu-center-logo svg {
        pointer-events: none;
      }

      .menu-center-logo:hover {
        transform: scale(1.15);
        opacity: 0.85;
      }


      /* ==================== ESTADO 2: RECORDING (PTT Ativo) ==================== */
      .thought-bubble.state-recording {
        width: 76px;
        background: rgba(18, 14, 16, 0.92);
        border-color: rgba(255, 69, 58, 0.4);
        box-shadow: 0 0 16px rgba(255, 69, 58, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      .waveform-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        height: 18px;
        width: 100%;
        --audio-scale: 1;
      }

      .wave-bar {
        width: 2.2px;
        height: 12px;
        background: #FFFFFF;
        border-radius: 1px;
        transform-origin: center;
        will-change: transform;
        transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1)));
        animation: waveAnim 1s infinite ease-in-out;
      }

      @keyframes waveAnim {
        0%, 100% { transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1) * 0.8)); }
        20% { transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1) * 1.25)); }
        40% { transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1) * 1.6)); }
        80% { transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1) * 1.1)); }
        90% { transform: scaleY(calc(var(--audio-scale, 1) * var(--bar-scale, 1) * 1.35)); }
      }

      /* ==================== ESTADO 3: PROCESSING (Rainbow Conic Ring) ==================== */
      .thought-bubble.state-processing {
        width: 98px;
        background: #0f0f12;
        border: none !important;
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }

      .thought-bubble.state-processing::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 300px;
        height: 300px;
        background: conic-gradient(from 0deg, #f0d7ff, #ffbcf2, #ff6c4c, #ffa946, #7232a6, #f0d7ff);
        transform: translate(-50%, -50%) rotate(0deg);
        transform-origin: center center;
        animation: rainbowSpin 3.5s linear infinite;
        will-change: transform;
        z-index: 0;
      }

      .thought-bubble.state-processing::after {
        content: "";
        position: absolute;
        inset: 1px;
        background: #0f0f12;
        border-radius: inherit;
        z-index: 1;
        opacity: 1 !important;
        animation: none !important;
        mask: none !important;
        -webkit-mask: none !important;
      }

      @keyframes rainbowSpin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      .processing-content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      /* Radial 8-bar spinner (authentic Wispr REA module-64037) */
      .radial-spinner {
        position: relative;
        width: 14px;
        height: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .spinner-tick {
        position: absolute;
        width: 1.8px;
        height: 4.5px;
        border-radius: 1px;
        background: rgba(163, 148, 199, 0.3);
        transform-origin: center center;
        animation: tickFade 1.1s linear infinite;
      }

      @keyframes tickFade {
        0% { background: rgba(163, 148, 199, 0.95); }
        100% { background: rgba(163, 148, 199, 0.15); }
      }

      .processing-label {
        font-size: 11px;
        font-weight: 550;
        color: #C4B5FD;
        letter-spacing: -0.1px;
        white-space: nowrap;
      }

      /* ==================== ESTADO 4: COMPLETED (Checkmark Sucesso) ==================== */
      .thought-bubble.state-completed {
        width: 104px;
        border-color: rgba(52, 199, 89, 0.45);
        box-shadow: 0 0 16px rgba(52, 199, 89, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      .completed-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        color: #34C759;
      }

      .check-icon {
        width: 13px;
        height: 13px;
        stroke: #34C759;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .completed-label {
        font-size: 11px;
        font-weight: 600;
        color: #34C759;
        letter-spacing: -0.1px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="capsule-wrapper">
      <div class="thought-bubble state-resting" id="thoughtBubble" title="Aion Voice Dictation (Ctrl+Win)">
        <!-- Conteúdo Injetado Dinamicamente -->
        <div id="bubbleInner" style="display:flex;align-items:center;width:100%;height:100%;justify-content:center;"></div>
      </div>
    </div>

    <script>
      const thoughtBubble = document.getElementById("thoughtBubble");
      const bubbleInner = document.getElementById("bubbleInner");

      let currentStatus = "resting";
      let audioScale = 1;
      let lastStateChangeTime = 0;

      // Posição atual da cápsula (sincronizada com o main process no load, pra o
      // botão de ciclar posições continuar de onde parou após um restart do app).
      const CAPSULE_POSITION_ORDER = ["bottom", "top", "left", "right"];
      const CAPSULE_POSITION_LABEL = { bottom: "embaixo", top: "em cima", left: "na esquerda", right: "na direita" };
      let capsulePosition = "bottom";
      (async () => {
        try {
          if (window.astterNative && window.astterNative.getCapsulePosition) {
            capsulePosition = await window.astterNative.getCapsulePosition();
          }
        } catch (_) {}
      })();

      // Renderiza o interior da cápsula com base no estado REA
      function renderBubble(status) {
        currentStatus = status;
        lastStateChangeTime = Date.now();
        thoughtBubble.className = "thought-bubble";

        if (status === "active_ptt" || status === "active" || status === "listening") {
          // ==================== GRAVANDO (Waveform 5 barras parabólicas) ====================
          thoughtBubble.classList.add("state-recording");
          bubbleInner.innerHTML = `
            <div class="waveform-wrap" id="waveWrap">
              <div class="wave-bar" style="--bar-scale: 0.35; animation-delay: -0.2s;"></div>
              <div class="wave-bar" style="--bar-scale: 0.70; animation-delay: -0.1s;"></div>
              <div class="wave-bar" style="--bar-scale: 1.00; animation-delay: 0s;"></div>
              <div class="wave-bar" style="--bar-scale: 0.70; animation-delay: 0.1s;"></div>
              <div class="wave-bar" style="--bar-scale: 0.35; animation-delay: 0.2s;"></div>
            </div>
          `;
        } else if (status === "polish_processing" || status === "processing") {
          // ==================== PROCESSANDO (Rainbow Conic + Radial 8-bar Spinner) ====================
          thoughtBubble.classList.add("state-processing");
          let ticks = "";
          for (let i = 0; i < 8; i++) {
            const rot = i * 45;
            const delay = (0.1375 * -(7 - i)).toFixed(4);
            ticks += `<div class="spinner-tick" style="transform: rotate(${rot}deg) translate(0, -5px); animation-delay: ${delay}s;"></div>`;
          }
          bubbleInner.innerHTML = `
            <div class="processing-content">
              <div class="radial-spinner">${ticks}</div>
              <span class="processing-label">Aion...</span>
            </div>
          `;
        } else if (status === "polish_completed_action" || status === "completed") {
          // ==================== CONCLUÍDO (Checkmark verde) ====================
          thoughtBubble.classList.add("state-completed");
          bubbleInner.innerHTML = `
            <div class="completed-content">
              <svg class="check-icon" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span class="completed-label">Copiado!</span>
            </div>
          `;
          setTimeout(() => {
            if (currentStatus === "polish_completed_action" || currentStatus === "completed") {
              renderBubble("resting");
            }
          }, 1400);
        } else if (status === "menu") {
          // ==================== MENU (Microfone + Logo + Settings) ====================
          thoughtBubble.classList.add("state-menu");
          bubbleInner.innerHTML = `
            <div class="menu-content">
              <div class="drag-handle" id="menuDragHandle" title="Arrastar cápsula (Clique duplo para reposicionar)">
                <svg width="6" height="12" viewBox="0 0 6 12" fill="currentColor">
                  <circle cx="1.5" cy="2" r="1"/>
                  <circle cx="4.5" cy="2" r="1"/>
                  <circle cx="1.5" cy="6" r="1"/>
                  <circle cx="4.5" cy="6" r="1"/>
                  <circle cx="1.5" cy="10" r="1"/>
                  <circle cx="4.5" cy="10" r="1"/>
                </svg>
              </div>
              <button class="pill-btn mic-btn" id="menuMicBtn" title="Gravar voz (Ctrl+Win)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                  <line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
              </button>
              <button class="pill-btn meeting-btn" id="menuMeetingBtn" title="Gravar Reunião / Granola" style="color: #f97316;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
                  <line x1="16" x2="16" y1="2" y2="6"/>
                  <line x1="8" x2="8" y1="2" y2="6"/>
                  <line x1="3" x2="21" y1="10" y2="10"/>
                </svg>
              </button>
              <div class="menu-center-logo" id="menuLogoBtn" title="Fechar menu">
                <svg class="flow-symbol-svg" viewBox="0 0 187 187" fill="none">
                  <rect width="187" height="187" rx="40" fill="#1A1A1A"/>
                  <path d="M48.1 41.6C44.2 41.6 40.6 45.2 40.6 49.1V137.8C40.6 142.5 44.3 145.4 48.1 145.4C52 145.4 55.6 141.8 55.6 137.9V49.1C55.6 45.2 52 41.6 48.1 41.6Z" fill="#FFFFEB"/>
                  <path d="M93.4 58.6C89.6 58.6 85.9 62.2 85.9 66V120.2C85.9 124.1 89.6 127.6 93.4 127.6C97.3 127.6 101 124.1 101 120.2V66C101 62.2 97.3 58.6 93.4 58.6Z" fill="#FFFFEB"/>
                  <path d="M70.8 89.1C66.8 89.1 63.2 92.7 63.2 96.6V127.5C63.2 131.3 66.8 134.9 70.8 134.9C74.7 134.9 78.3 131.3 78.3 127.5V96.6C78.3 92.7 74.7 89.1 70.8 89.1Z" fill="#FFFFEB"/>
                  <path d="M138.7 41.6C134.9 41.6 131.1 45.2 131.1 49.1V137.8C131.1 141.7 134.8 145.3 138.7 145.3C142.6 145.3 146.2 141.7 146.2 137.8V49.1C146.2 45.2 142.6 41.6 138.7 41.6Z" fill="#FFFFEB"/>
                  <path d="M116 89.1C112 89.1 108.5 92.7 108.5 96.6V127.5C108.5 131.3 112 134.9 116 134.9C120 134.9 123.6 131.3 123.6 127.5V96.6C123.6 92.7 120 89.1 116 89.1Z" fill="#FFFFEB"/>
                </svg>
              </div>
              <button class="pill-btn position-btn" id="menuPositionBtn" title="Posição da cápsula (clique para alternar: embaixo → cima → esquerda → direita)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="5 9 2 12 5 15"></polyline>
                  <polyline points="9 5 12 2 15 5"></polyline>
                  <polyline points="15 19 12 22 9 19"></polyline>
                  <polyline points="19 9 22 12 19 15"></polyline>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <line x1="12" y1="2" x2="12" y2="22"></line>
                </svg>
              </button>
              <button class="pill-btn settings-btn" id="menuSettingsBtn" title="Configurações do Aion">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
              </button>
            </div>
          `;

          const mic = document.getElementById("menuMicBtn");
          const meetingBtn = document.getElementById("menuMeetingBtn");
          const settings = document.getElementById("menuSettingsBtn");
          const positionBtn = document.getElementById("menuPositionBtn");
          const logo = document.getElementById("menuLogoBtn");
          const menuGrip = document.getElementById("menuDragHandle");

          thoughtBubble.onclick = null;
          thoughtBubble.onpointerdown = null;
          thoughtBubble.onpointerup = null;

          if (menuGrip) {
            menuGrip.addEventListener("dblclick", (e) => {
              e.stopPropagation();
              if (window.astterNative && window.astterNative.triggerWindowMove) {
                window.astterNative.triggerWindowMove();
              }
            });
          }

          if (mic) {
            bindAction(mic, (e) => {
              console.log("🎙️ [Capsule] Botão de microfone acionado!");
              if (typeof toggleRecording === "function") {
                toggleRecording();
              } else if (window.astterNative && typeof window.astterNative.triggerDictation === "function") {
                window.astterNative.triggerDictation();
              }
            });
          }

          if (meetingBtn) {
            bindAction(meetingBtn, () => {
              console.log("🎙️ [Capsule] Botão de reunião acionado!");
              if (window.astterNative?.meeting?.start) {
                window.astterNative.meeting.start();
              }
            });
          }

          if (positionBtn) {
            bindAction(positionBtn, () => {
              const idx = CAPSULE_POSITION_ORDER.indexOf(capsulePosition);
              capsulePosition = CAPSULE_POSITION_ORDER[(idx + 1) % CAPSULE_POSITION_ORDER.length];
              console.log("📍 [Capsule] Nova posição:", capsulePosition);
              positionBtn.title = `Cápsula ${CAPSULE_POSITION_LABEL[capsulePosition]} (clique para alternar)`;
              if (window.astterNative && window.astterNative.setCapsulePosition) {
                window.astterNative.setCapsulePosition(capsulePosition);
              }
              // A janela "teleporta" pro canto novo via KWin (sem animação de
              // movimento), então sem esse pulso o usuário não percebe que ela
              // mudou de lugar se não estiver olhando pro canto certo.
              setTimeout(() => {
                thoughtBubble.classList.remove("reposition-pulse");
                void thoughtBubble.offsetWidth;
                thoughtBubble.classList.add("reposition-pulse");
              }, 420);
            });
          }

          if (settings) {
            bindAction(settings, (e) => {
              console.log("⚙️ [Capsule] Abrindo configurações do Astter...");
              if (window.astterNative && typeof window.astterNative.openSettings === "function") {
                window.astterNative.openSettings();
              } else if (window.astterNative && typeof window.astterNative.toggleHub === "function") {
                window.astterNative.toggleHub();
              }
              renderBubble("resting");
            });
          }

          if (logo) {
            bindAction(logo, (e) => {
              console.log("✕ [Capsule] Fechando menu para resting");
              renderBubble("resting");
            });
          }
        } else if (status === "meeting_recording") {
          // ==================== REUNIÃO GRAVANDO (Dual Channel / Granola) ====================
          thoughtBubble.classList.add("state-meeting");
          bubbleInner.innerHTML = `
            <div class="meeting-content">
              <span class="meeting-dot"></span>
              <span class="meeting-time" id="capsuleMeetingTimer">00:00</span>
              <span class="meeting-speaker-pill" id="capsuleSpeakerPill">Você</span>
              <button class="stop-meeting-btn" id="capsuleStopBtn" title="Finalizar Reunião">■</button>
            </div>
          `;
          const stopBtn = document.getElementById("capsuleStopBtn");
          if (stopBtn) {
            bindAction(stopBtn, () => {
              console.log("⏹️ [Capsule] Finalizando gravação da reunião...");
              if (window.astterNative?.meeting?.stop) {
                window.astterNative.meeting.stop();
              }
            });
          }
        } else {
          // ==================== RESTING (Grip + Logo do Aion) ====================
          thoughtBubble.classList.add("state-resting");
          bubbleInner.innerHTML = `
            <div class="drag-handle" id="restingDragHandle" title="Arrastar cápsula (Clique duplo para reposicionar)">
              <svg width="7" height="13" viewBox="0 0 7 13" fill="currentColor">
                <circle cx="1.8" cy="2" r="1.1"/>
                <circle cx="5.2" cy="2" r="1.1"/>
                <circle cx="1.8" cy="6.5" r="1.1"/>
                <circle cx="5.2" cy="6.5" r="1.1"/>
                <circle cx="1.8" cy="11" r="1.1"/>
                <circle cx="5.2" cy="11" r="1.1"/>
              </svg>
            </div>
            <div class="resting-logo" id="restingLogoBtn" title="Aion (Clique para abrir opções | Ctrl+Win para falar)">
              <svg class="flow-symbol-svg" viewBox="0 0 187 187" fill="none">
                <rect width="187" height="187" rx="40" fill="#1A1A1A"/>
                <path d="M48.1 41.6C44.2 41.6 40.6 45.2 40.6 49.1V137.8C40.6 142.5 44.3 145.4 48.1 145.4C52 145.4 55.6 141.8 55.6 137.9V49.1C55.6 45.2 52 41.6 48.1 41.6Z" fill="#FFFFEB"/>
                <path d="M93.4 58.6C89.6 58.6 85.9 62.2 85.9 66V120.2C85.9 124.1 89.6 127.6 93.4 127.6C97.3 127.6 101 124.1 101 120.2V66C101 62.2 97.3 58.6 93.4 58.6Z" fill="#FFFFEB"/>
                <path d="M70.8 89.1C66.8 89.1 63.2 92.7 63.2 96.6V127.5C63.2 131.3 66.8 134.9 70.8 134.9C74.7 134.9 78.3 131.3 78.3 127.5V96.6C78.3 92.7 74.7 89.1 70.8 89.1Z" fill="#FFFFEB"/>
                <path d="M138.7 41.6C134.9 41.6 131.1 45.2 131.1 49.1V137.8C131.1 141.7 134.8 145.3 138.7 145.3C142.6 145.3 146.2 141.7 146.2 137.8V49.1C146.2 45.2 142.6 41.6 138.7 41.6Z" fill="#FFFFEB"/>
                <path d="M116 89.1C112 89.1 108.5 92.7 108.5 96.6V127.5C108.5 131.3 112 134.9 116 134.9C120 134.9 123.6 131.3 123.6 127.5V96.6C123.6 92.7 120 89.1 116 89.1Z" fill="#FFFFEB"/>
              </svg>
            </div>
          `;

          const restingGrip = document.getElementById("restingDragHandle");
          if (restingGrip) {
            restingGrip.addEventListener("dblclick", (e) => {
              e.stopPropagation();
              if (window.astterNative && window.astterNative.triggerWindowMove) {
                window.astterNative.triggerWindowMove();
              }
            });
          }
        }
      }

      // Controlador unificado de arraste suave (Linux Wayland & X11)
      let isDragging = false;
      let dragStartX = 0;
      let dragStartY = 0;
      let dragHasMoved = false;

      window.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        if (e.target.closest("button") || e.target.closest(".pill-btn")) return;
        if (thoughtBubble && thoughtBubble.contains(e.target)) {
          isDragging = true;
          dragHasMoved = false;
          dragStartX = e.screenX;
          dragStartY = e.screenY;
          document.body.style.pointerEvents = "auto";
        }
      });

      window.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const dx = e.screenX - dragStartX;
        const dy = e.screenY - dragStartY;
        // Mouse/trackpad real sempre treme uns pixels mesmo num clique parado;
        // threshold baixo demais (ex: 2px) faz todo clique virar "arraste" e a
        // cápsula nunca abre o menu nem dispara nenhuma ação.
        if (Math.hypot(dx, dy) > 6) {
          dragHasMoved = true;
        }
        if (dragHasMoved && (dx !== 0 || dy !== 0)) {
          dragStartX = e.screenX;
          dragStartY = e.screenY;
          if (window.astterNative && typeof window.astterNative.moveStatus === "function") {
            window.astterNative.moveStatus(dx, dy);
          }
        }
      });

      window.addEventListener("pointerup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        document.body.style.pointerEvents = "none";
        if (!dragHasMoved && currentStatus === "resting") {
          if (Date.now() - lastStateChangeTime > 200) {
            renderBubble("menu");
          }
        }
      });

      // Helper robusto para cliques em ambientes Linux/Electron com suporte a drag
      function bindAction(element, callback) {
        if (!element) return;
        let lastTrigger = 0;
        const trigger = (e) => {
          const now = Date.now();
          if (now - lastTrigger < 300) return;
          lastTrigger = now;
          if (e) {
            try { e.stopPropagation(); } catch (_) {}
            try { e.preventDefault(); } catch (_) {}
          }
          callback(e);
        };

        element.addEventListener("click", (e) => {
          trigger(e);
        });
      }

      // Clique fora recolhe o menu com proteção contra eventos simultâneos ao abrir
      window.addEventListener("pointerdown", (e) => {
        if (Date.now() - lastStateChangeTime < 350) return;
        if (currentStatus === "menu" && !thoughtBubble.contains(e.target)) {
          renderBubble("resting");
        }
      });
      window.addEventListener("click", (e) => {
        if (Date.now() - lastStateChangeTime < 350) return;
        if (currentStatus === "menu" && !thoughtBubble.contains(e.target)) {
          renderBubble("resting");
        }
      });

      // Escuta mudanças de status disparadas pelo Bridge
      window.addEventListener("astter:dictationStatus", (e) => {
        renderBubble(e.detail);
      });

      // Escuta nível de áudio em tempo real para animar as barras
      window.addEventListener("astter:audioLevel", (e) => {
        const level = e.detail || 0;
        const wrap = document.getElementById("waveWrap");
        if (wrap) {
          const s = Math.min(2.5, Math.max(0.7, 0.8 + level * 2.8));
          wrap.style.setProperty("--audio-scale", s);
        }
      });

      // Auto-fechamento do menu ao tirar o mouse
      let menuLeaveTimer = null;
      thoughtBubble.addEventListener("mouseleave", () => {
        if (currentStatus === "menu") {
          menuLeaveTimer = setTimeout(() => {
            if (currentStatus === "menu") renderBubble("resting");
          }, 3500);
        }
      });
      thoughtBubble.addEventListener("mouseenter", () => {
        if (menuLeaveTimer) {
          clearTimeout(menuLeaveTimer);
          menuLeaveTimer = null;
        }
      });

      // Ao perder foco da janela, volta ao modo resting se estava no menu
      window.addEventListener("blur", () => {
        if (currentStatus === "menu") {
          renderBubble("resting");
        }
      });

      // Clique com botão direito em qualquer modo abre o Astter Hub
      thoughtBubble.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        if (window.astterNative && window.astterNative.toggleHub) {
          window.astterNative.toggleHub();
        }
      });

      // Escuta eventos de Reunião (Granola Dual Channel)
      if (window.astterNative && window.astterNative.meeting) {
        let meetingTimerInterval = null;
        let meetingSeconds = 0;

        window.astterNative.meeting.onStarted((data) => {
          renderBubble("meeting_recording");
          meetingSeconds = 0;
          clearInterval(meetingTimerInterval);
          meetingTimerInterval = setInterval(() => {
            meetingSeconds++;
            const m = Math.floor(meetingSeconds / 60).toString().padStart(2, "0");
            const s = (meetingSeconds % 60).toString().padStart(2, "0");
            const el = document.getElementById("capsuleMeetingTimer");
            if (el) el.textContent = `${m}:${s}`;
          }, 1000);
        });

        window.astterNative.meeting.onFinished(() => {
          clearInterval(meetingTimerInterval);
          renderBubble("completed");
        });

        window.astterNative.meeting.onActiveSpeaker((data) => {
          const pill = document.getElementById("capsuleSpeakerPill");
          if (pill && data && data.speaker) {
            pill.textContent = data.speaker;
          }
        });
      }

      // Inicializa
      renderBubble("resting");
    </script>
  </body>
</html>
